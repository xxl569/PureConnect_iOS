name: ios-ipa

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_TEMPLATES_DIR_NAME: "4.3.stable"
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust & aarch64-apple-ios target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-ios
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('Cargo.lock') }}

      - name: Build pure_connect_godot iOS arm64 static library
        run: |
          set -euo pipefail
          export IPHONEOS_DEPLOYMENT_TARGET="${IPHONEOS_DEPLOYMENT_TARGET}"
          cargo build --release --target aarch64-apple-ios -p pure_connect_godot
          mkdir -p project/bin/ios
          cp -f target/aarch64-apple-ios/release/libpure_connect_godot.a project/bin/ios/libpure_connect_godot.a
          lipo -info project/bin/ios/libpure_connect_godot.a
          (nm -gU project/bin/ios/libpure_connect_godot.a 2>/dev/null || true) | grep -q "gdext_rust_init"
          echo "Verified gdext_rust_init symbol present in libpure_connect_godot.a"

      - name: Cache Godot 4.3 macOS & Export Templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.3
            ~/Library/Application Support/Godot/export_templates/4.3.stable
          key: godot-4.3-ios-templates-v1

      - name: Install Godot 4.3 & Export Templates
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/godot-4.3
          mkdir -p "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}"

          GODOT_ZIP="${HOME}/.cache/godot-4.3/Godot_v${GODOT_VERSION}_macos.universal.zip"
          TPZ_FILE="${HOME}/.cache/godot-4.3/Godot_v${GODOT_VERSION}_export_templates.tpz"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"

          if [ ! -f "${GODOT_ZIP}" ]; then
            curl -fsSL -o "${GODOT_ZIP}" "${BASE_URL}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          fi
          rm -rf "${HOME}/.cache/godot-4.3/Godot.app"
          unzip -q "${GODOT_ZIP}" -d "${HOME}/.cache/godot-4.3"
          GODOT_BIN="${HOME}/.cache/godot-4.3/Godot.app/Contents/MacOS/Godot"
          chmod +x "${GODOT_BIN}"
          echo "GODOT_BIN=${GODOT_BIN}" >> "${GITHUB_ENV}"
          "${GODOT_BIN}" --version

          if [ ! -f "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}/ios.zip" ]; then
            if [ ! -f "${TPZ_FILE}" ]; then
              curl -fsSL -o "${TPZ_FILE}" "${BASE_URL}/Godot_v${GODOT_VERSION}_export_templates.tpz"
            fi
            mkdir -p /tmp/godot_tpz
            unzip -q -o "${TPZ_FILE}" "templates/ios.zip" "templates/version.txt" -d /tmp/godot_tpz
            cp -f /tmp/godot_tpz/templates/ios.zip "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}/ios.zip"
            cp -f /tmp/godot_tpz/templates/version.txt "${HOME}/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}/version.txt"
            rm -rf /tmp/godot_tpz
          fi

      - name: Import Godot assets
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path "${PWD}/project" --import --quit || true

      - name: Export Godot iOS Xcode Project & PCK
        run: |
          set -euo pipefail
          mkdir -p project/build/ios artifacts reports
          "${GODOT_BIN}" --headless --path "${PWD}/project" --export-release "iOS" "build/ios/PureConnect_iOS.xcodeproj"
          "${GODOT_BIN}" --headless --path "${PWD}/project" --export-pack "iOS" "${PWD}/artifacts/PureConnect_iOS.pck"
          ls -la project/build/ios

      - name: Ensure -force_load for libpure_connect_godot.a in Xcode project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import glob

          pbx = Path("project/build/ios/PureConnect_iOS.xcodeproj/project.pbxproj")
          assert pbx.is_file(), f"Missing {pbx}"
          text = pbx.read_text(encoding="utf-8")

          # 定位 Godot 导出目录中拷贝的静态库路径
          candidates = glob.glob("project/build/ios/**/libpure_connect_godot.a", recursive=True)
          print("Found exported static libs:", candidates)
          if "libpure_connect_godot.a" not in text:
              print("WARNING: libpure_connect_godot.a not referenced in project.pbxproj yet")

          force_flag = '"-force_load", "$(PROJECT_DIR)/../../bin/ios/libpure_connect_godot.a",'
          if "-force_load" not in text and "OTHER_LDFLAGS = (" in text:
              text = text.replace("OTHER_LDFLAGS = (", f"OTHER_LDFLAGS = (\n\t\t\t\t{force_flag}", 1)
              pbx.write_text(text, encoding="utf-8")
              print("Injected -force_load into OTHER_LDFLAGS")
          else:
              print("-force_load already present or OTHER_LDFLAGS uses different format")
          PY

      - name: Build PureConnect_iOS.app via xcodebuild (arm64, unsigned shell)
        run: |
          set -euo pipefail
          XCODEPROJ="project/build/ios/PureConnect_iOS.xcodeproj"
          xcodebuild -list -json -project "${XCODEPROJ}" > project/build/ios/xcode_list.json
          BUILD_ARGS=()
          SCHEME_NAME="$(python3 -c 'import json; d=json.load(open("project/build/ios/xcode_list.json")); s=d.get("project",{}).get("schemes",[]); print("PureConnect_iOS" if "PureConnect_iOS" in s else (s[0] if s else ""))')"
          TARGET_NAME="$(python3 -c 'import json; d=json.load(open("project/build/ios/xcode_list.json")); t=d.get("project",{}).get("targets",[]); print("PureConnect_iOS" if "PureConnect_iOS" in t else (t[0] if t else "PureConnect_iOS"))')"
          if [ -n "${SCHEME_NAME}" ]; then
            BUILD_ARGS+=(-scheme "${SCHEME_NAME}" -destination 'generic/platform=iOS')
          else
            BUILD_ARGS+=(-target "${TARGET_NAME}" -arch arm64)
          fi

          xcodebuild \
            -project "${XCODEPROJ}" \
            "${BUILD_ARGS[@]}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath project/build/ios/derived \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET="${IPHONEOS_DEPLOYMENT_TARGET}" \
            OTHER_LDFLAGS='$(inherited) -force_load $(PROJECT_DIR)/../../bin/ios/libpure_connect_godot.a' \
            build

          APP="$(find project/build/ios/derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "${APP}" && test -d "${APP}"
          echo "BUILT_APP=${APP}" >> "${GITHUB_ENV}"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Info.plist")"
          test -x "${APP}/${EXEC_NAME}"
          file "${APP}/${EXEC_NAME}"
          (nm -gU "${APP}/${EXEC_NAME}" 2>/dev/null || true) | grep -E "gdext_rust_init" | head -n 3 || true

      - name: Pseudo-sign with ldid & Package TrollStore IPA + Windows Shell
        run: |
          set -euo pipefail
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
          APP="${BUILT_APP}"
          python3 tools/package_trollstore_ipa.py package \
            --app-shell "${APP}" \
            --pck "artifacts/PureConnect_iOS.pck" \
            --entitlements "platforms/ios/Entitlements_TrollStore.plist" \
            --output "artifacts/PureConnect_iOS_TrollStore.ipa" \
            --report-json "reports/ipa_report.json"

          rm -rf "${APP}/_CodeSignature"
          APP_DIR="$(dirname "${APP}")"
          APP_BASE="$(basename "${APP}")"
          (cd "${APP_DIR}" && zip -qry "${OLDPWD}/artifacts/PureConnect_iOS_Shell.zip" "${APP_BASE}")

      - name: Upload IPA & Shell artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureConnect_iOS_TrollStore
          path: |
            artifacts/PureConnect_iOS_TrollStore.ipa
            artifacts/PureConnect_iOS_Shell.zip
            artifacts/PureConnect_iOS.pck
            reports/ipa_report.json
          compression-level: 0
